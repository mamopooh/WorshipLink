<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorshipLink — 教会情報</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Lato:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0faf4; --surface: #ffffff; --surface2: #e8f5ee;
    --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
    --text: #1a2e1a; --text2: #4a6650; --text3: #7a9a80;
    --accent: #6c4ff8; --accent2: #5a3ee0;
    --accent-bg: rgba(108,79,248,0.08); --accent-border: rgba(108,79,248,0.25);
    --green: #2a9a5a; --green-bg: rgba(42,154,90,0.10);
    --radius: 14px; --radius-sm: 8px;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(240,250,244,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border2);
    padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px;
  }
  .logo { font-family: 'Lato', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .logo-cross { width: 20px; height: 26px; position: relative; display: flex; align-items: center; justify-content: center; }
  .logo-cross::before, .logo-cross::after { content: ''; position: absolute; background: var(--accent); border-radius: 2px; }
  .logo-cross::before { width: 4px; height: 26px; left: 50%; transform: translateX(-50%); }
  .logo-cross::after { width: 20px; height: 4px; top: 7px; left: 50%; transform: translateX(-50%); }
  .logo span { color: var(--accent2); }
  .back-btn { font-size: 12px; color: var(--text3); text-decoration: none; padding: 5px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); }

  /* タブ */
  .tab-nav { display: flex; border-bottom: 1px solid var(--border2); background: var(--surface); padding: 0 1.5rem; }
  .tab-btn { padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--text3); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s; }
  .tab-btn:hover { color: var(--text2); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-page { display: none; }
  .tab-page.active { display: block; }

  /* メインレイアウト */
  .main { display: flex; max-width: 960px; margin: 0 auto; width: 100%; padding: 1.5rem 1rem; gap: 1.5rem; }
  .sidebar { width: 220px; flex-shrink: 0; }
  .sidebar-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
  .sidebar-title { font-size: 11px; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px; color: var(--text2); cursor: pointer; margin-bottom: 2px; transition: background 0.15s, color 0.15s; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .nav-icon { font-size: 16px; width: 18px; text-align: center; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); cursor: pointer; }
  .tag:hover, .tag.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
  .feed { flex: 1; min-width: 0; }

  /* マップ */
  .map-container {
    width: 100%; height: 360px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 1.25rem;
    position: relative;
  }
  .map-container iframe { width: 100%; height: 100%; border: none; }
  .map-placeholder {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 12px; color: var(--text3); font-size: 14px;
  }
  .map-placeholder-icon { font-size: 40px; }

  /* 教会カード */
  .church-grid { display: flex; flex-direction: column; gap: 1rem; }
  .church-card {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 1.25rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  .church-card:hover { border-color: var(--accent-border); box-shadow: 0 4px 20px rgba(108,79,248,0.08); }
  .church-card.selected { border-color: var(--accent); background: var(--accent-bg); }
  .church-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
  .church-icon {
    width: 46px; height: 46px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
    background: var(--accent-bg);
  }
  .church-info { flex: 1; }
  .church-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .church-denom { font-size: 11px; color: var(--accent); background: var(--accent-bg); border: 0.5px solid var(--accent-border); border-radius: 20px; padding: 2px 8px; display: inline-block; margin-bottom: 4px; }
  .church-address { font-size: 12px; color: var(--text3); display: flex; align-items: center; gap: 4px; }
  .church-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .church-detail-item { font-size: 12px; color: var(--text2); display: flex; align-items: flex-start; gap: 5px; }
  .church-detail-label { color: var(--text3); flex-shrink: 0; }
  .church-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn-map { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--accent); background: var(--accent-bg); border: 0.5px solid var(--accent-border); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; text-decoration: none; transition: opacity 0.15s; }
  .btn-map:hover { opacity: 0.8; }
  .btn-web { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--green); background: var(--green-bg); border: 0.5px solid rgba(42,154,90,0.3); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; text-decoration: none; transition: opacity 0.15s; }
  .btn-web:hover { opacity: 0.8; }

  /* 登録フォーム */
  .register-form { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.5rem; }
  .register-form h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .register-form .sub { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; line-height: 1.6; }
  .form-group { margin-bottom: 1rem; }
  .form-label { font-size: 12px; color: var(--text3); font-weight: 600; display: block; margin-bottom: 5px; }
  .form-input, .form-select, .form-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 13px; outline: none; transition: border-color 0.15s; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent-border); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .btn-submit { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 12px 32px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: opacity 0.15s; }
  .btn-submit:hover { opacity: 0.85; }
  .success-box { text-align: center; padding: 2rem; }
  .success-icon { font-size: 48px; margin-bottom: 12px; }
  .success-title { font-size: 18px; font-weight: 700; color: var(--green); margin-bottom: 8px; }
  .success-msg { font-size: 13px; color: var(--text2); line-height: 1.7; }

  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); border-radius: var(--radius-sm); padding: 10px 20px; font-size: 13px; color: #fff; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 400; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 680px) {
    .sidebar { display: none; }
    .main { padding: 1rem 0.75rem; }
    .church-details { grid-template-columns: 1fr; }
    .map-container { height: 260px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-cross"></div>Worship<span>Link</span></div>
  <a href="index.html" class="back-btn">← トップへ</a>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('list')" id="tab-list">⛪ 教会一覧</button>
  <button class="tab-btn" onclick="switchTab('register')" id="tab-register">✏️ 教会を登録する</button>
</nav>

<!-- 教会一覧タブ -->
<div class="tab-page active" id="page-list">
  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-card">
        <div class="sidebar-title">地域で探す</div>
        <div class="nav-item active" onclick="filterChurches('', this)"><span class="nav-icon">🗾</span> すべて</div>
        <div class="nav-item" onclick="filterChurches('東京', this)"><span class="nav-icon">🗼</span> 東京</div>
        <div class="nav-item" onclick="filterChurches('大阪', this)"><span class="nav-icon">🏯</span> 大阪</div>
        <div class="nav-item" onclick="filterChurches('名古屋', this)"><span class="nav-icon">🌸</span> 名古屋</div>
        <div class="nav-item" onclick="filterChurches('福岡', this)"><span class="nav-icon">⛩</span> 福岡</div>
        <div class="nav-item" onclick="filterChurches('札幌', this)"><span class="nav-icon">❄️</span> 札幌</div>
      </div>
      <div class="sidebar-card">
        <div class="sidebar-title">教団・種別</div>
        <div class="tag-list">
          <span class="tag" onclick="filterChurches('プロテスタント', null)">プロテスタント</span>
          <span class="tag" onclick="filterChurches('カトリック', null)">カトリック</span>
          <span class="tag" onclick="filterChurches('ペンテコステ', null)">ペンテコステ</span>
          <span class="tag" onclick="filterChurches('超教派', null)">超教派</span>
          <span class="tag" onclick="filterChurches('ゴスペル', null)">ゴスペル</span>
        </div>
      </div>
    </aside>

    <main class="feed">
      <!-- マップ -->
      <div class="map-container" id="mapArea">
        <div class="map-placeholder">
          <div class="map-placeholder-icon">🗺️</div>
          <div style="font-weight:600;color:var(--text2);">教会マップ</div>
          <div style="font-size:12px;">下のリストから教会を選ぶとマップに表示されます</div>
        </div>
      </div>

      <!-- 教会リスト -->
      <div class="church-grid" id="churchGrid"></div>
    </main>
  </div>
</div>

<!-- 教会登録タブ -->
<div class="tab-page" id="page-register">
  <div class="main">
    <div class="feed">
      <div class="register-form" id="churchRegisterWrap">
        <h2>⛪ 教会を登録する</h2>
        <div class="sub">あなたの教会をWorshipLinkに掲載しませんか？登録・掲載は無料です。</div>
        <div class="form-group">
          <label class="form-label">教会名 *</label>
          <input class="form-input" id="cName" type="text" placeholder="例：東京グレースチャーチ">
        </div>
        <div class="form-group">
          <label class="form-label">教団・種別</label>
          <select class="form-select" id="cDenom">
            <option value="">選択してください</option>
            <option>プロテスタント</option>
            <option>カトリック</option>
            <option>ペンテコステ</option>
            <option>超教派</option>
            <option>バプテスト</option>
            <option>ゴスペル</option>
            <option>その他</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">住所 *</label>
          <input class="form-input" id="cAddress" type="text" placeholder="例：東京都渋谷区〇〇1-2-3">
        </div>
        <div class="form-group">
          <label class="form-label">礼拝時間</label>
          <input class="form-input" id="cService" type="text" placeholder="例：日曜日 10:00〜12:00">
        </div>
        <div class="form-group">
          <label class="form-label">電話番号</label>
          <input class="form-input" id="cPhone" type="text" placeholder="例：03-1234-5678">
        </div>
        <div class="form-group">
          <label class="form-label">ウェブサイト</label>
          <input class="form-input" id="cWeb" type="url" placeholder="例：https://example-church.jp">
        </div>
        <div class="form-group">
          <label class="form-label">教会の紹介・特徴</label>
          <textarea class="form-textarea" id="cDesc" placeholder="例：どなたでも気軽に来られるアットホームな教会です。ワーシップに力を入れています。"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">担当者メールアドレス *</label>
          <input class="form-input" id="cEmail" type="email" placeholder="例：info@example-church.jp">
        </div>
        <button class="btn-submit" onclick="submitChurchRegister()">登録申請する</button>
      </div>
      <div class="success-box" id="churchRegisterSuccess" style="display:none;">
        <div class="success-icon">✅</div>
        <div class="success-title">登録申請を受け付けました！</div>
        <div class="success-msg" id="churchRegisterMsg"></div>
        <button onclick="switchTab('list')" style="margin-top:1.25rem;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);padding:10px 24px;font-size:13px;font-weight:600;cursor:pointer;">教会一覧を見る</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const CHURCHES = [
  {
    id: 1, name: '東京グレースチャーチ', denom: 'プロテスタント',
    area: '東京', address: '東京都渋谷区代々木1-2-3',
    service: '日曜日 10:30〜12:00', phone: '03-1234-5678',
    web: '', desc: 'どなたでも気軽に来られるアットホームな教会です。ワーシップに力を入れており、毎週生バンドで賛美しています。',
    lat: 35.6812, lng: 139.7018
  },
  {
    id: 2, name: '大阪ホープチャーチ', denom: 'ペンテコステ',
    area: '大阪', address: '大阪府大阪市中央区難波4-5-6',
    service: '日曜日 10:00〜12:00・14:00〜16:00', phone: '06-2345-6789',
    web: '', desc: '活気あるワーシップと聖霊の働きを大切にしています。若者からシニアまで幅広い世代が集まる教会です。',
    lat: 34.6686, lng: 135.5027
  },
  {
    id: 3, name: '名古屋シャロームチャーチ', denom: '超教派',
    area: '名古屋', address: '愛知県名古屋市中区栄3-7-8',
    service: '日曜日 10:00〜11:30', phone: '052-345-6789',
    web: '', desc: '超教派のワーシップコミュニティです。賛美・祈り・みことばを中心とした礼拝を行っています。',
    lat: 35.1653, lng: 136.9021
  },
  {
    id: 4, name: '福岡ライフチャーチ', denom: 'プロテスタント',
    area: '福岡', address: '福岡県福岡市博多区博多駅前2-3-4',
    service: '日曜日 11:00〜12:30', phone: '092-456-7890',
    web: '', desc: '博多駅近くのアクセスしやすい教会。コンテンポラリーワーシップを取り入れた礼拝が特徴です。',
    lat: 33.5897, lng: 130.4218
  },
  {
    id: 5, name: '札幌グローリーチャーチ', denom: 'ペンテコステ',
    area: '札幌', address: '北海道札幌市中央区大通西5-1-2',
    service: '日曜日 10:30〜12:00', phone: '011-567-8901',
    web: '', desc: '北海道最大級のワーシップチームを持つ教会。毎月ワーシップナイトを開催しています。',
    lat: 43.0619, lng: 141.3545
  },
];

let currentFilter = '';
let selectedChurch = null;

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function filterChurches(keyword, el){
  currentFilter = keyword;
  document.querySelectorAll('#page-list .nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('#page-list .tag').forEach(t => t.classList.remove('active'));
  if(el) el.classList.add('active');
  renderChurches();
}

function renderChurches(){
  const grid = document.getElementById('churchGrid');
  const filtered = currentFilter
    ? CHURCHES.filter(c => c.area === currentFilter || c.denom === currentFilter)
    : CHURCHES;

  if(!filtered.length){
    grid.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text3);font-size:14px;"><div style="font-size:36px;margin-bottom:12px;">⛪</div>該当する教会が見つかりませんでした。</div>';
    return;
  }

  grid.innerHTML = filtered.map(c => `
    <div class="church-card ${selectedChurch && selectedChurch.id === c.id ? 'selected' : ''}" onclick="selectChurch(${c.id})">
      <div class="church-header">
        <div class="church-icon">⛪</div>
        <div class="church-info">
          <div class="church-name">${esc(c.name)}</div>
          <span class="church-denom">${esc(c.denom)}</span>
          <div class="church-address">📍 ${esc(c.address)}</div>
        </div>
      </div>
      <div class="church-details">
        <div class="church-detail-item"><span class="church-detail-label">🕐</span><span>${esc(c.service)}</span></div>
        <div class="church-detail-item"><span class="church-detail-label">📞</span><span>${esc(c.phone)}</span></div>
      </div>
      <p style="font-size:13px;color:var(--text2);line-height:1.6;margin-top:10px;">${esc(c.desc)}</p>
      <div class="church-actions">
        <a class="btn-map" onclick="event.stopPropagation();showMap(${c.id})">🗺️ マップで見る</a>
        ${c.web ? `<a class="btn-web" href="${esc(c.web)}" target="_blank" onclick="event.stopPropagation()">🌐 ウェブサイト</a>` : ''}
      </div>
    </div>
  `).join('');
}

function selectChurch(id){
  selectedChurch = CHURCHES.find(c => c.id === id);
  renderChurches();
  showMap(id);
}

function showMap(id){
  const church = CHURCHES.find(c => c.id === id);
  if(!church) return;
  const mapArea = document.getElementById('mapArea');
  const query = encodeURIComponent(church.address);
  mapArea.innerHTML = `<iframe
    src="https://maps.google.com/maps?q=${query}&output=embed&z=15&hl=ja"
    allowfullscreen loading="lazy">
  </iframe>`;
  mapArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function switchTab(tab){
  document.querySelectorAll('.tab-page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function submitChurchRegister(){
  const name = document.getElementById('cName').value.trim();
  const address = document.getElementById('cAddress').value.trim();
  const email = document.getElementById('cEmail').value.trim();
  if(!name){ showToast('教会名を入力してください'); return; }
  if(!address){ showToast('住所を入力してください'); return; }
  if(!email || !email.includes('@')){ showToast('正しいメールアドレスを入力してください'); return; }
  document.getElementById('churchRegisterWrap').style.display = 'none';
  document.getElementById('churchRegisterSuccess').style.display = 'block';
  document.getElementById('churchRegisterMsg').innerHTML =
    `<strong>${esc(name)}</strong> の登録申請を受け付けました。<br><br>` +
    `確認後、掲載させていただきます。<br>` +
    `登録完了のご連絡を <strong>${esc(email)}</strong> にお送りします。🙏`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

renderChurches();
</script>
</body>
</html>
