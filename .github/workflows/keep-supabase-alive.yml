name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send a request to the database
        env:
          SUPABASE_URL: https://itvzuviktxgjthwgnitf.supabase.co
          SUPABASE_KEY: sb_publishable_BlT2DI-F9CpfNb-GXFHZ5w_xz7ujUMj
        run: |
          set -u
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 30 --retry 3 --retry-delay 10 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/posts?select=id&limit=1") || status=000
          echo "HTTP status: ${status}"
          cat response.json 2>/dev/null || true
          echo
          case "${status}" in
            2??) echo "OK: Supabase answered." ;;
            *)   echo "::error::Supabase did not answer normally (HTTP ${status}). The project may be paused - restore it in the Supabase dashboard."; exit 1 ;;
          esac
