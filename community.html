<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorshipLink — コミュニティ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Lato:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0f1a; --surface: #131929; --surface2: #1a2236;
    --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
    --text: #e8eaf2; --text2: #8a90a8; --text3: #5a6080;
    --accent: #7c6cf8; --accent2: #a59bff;
    --accent-bg: rgba(124,108,248,0.12); --accent-border: rgba(124,108,248,0.28);
    --green: #50c896; --green-bg: rgba(80,200,150,0.10);
    --red: #f06070; --radius: 14px; --radius-sm: 8px;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .app { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(11,15,26,0.92); backdrop-filter: blur(12px);
    border-bottom: 0.5px solid var(--border2);
    padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px;
  }
  .logo { font-family: 'Lato', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .logo-cross { width: 22px; height: 22px; position: relative; display: flex; align-items: center; justify-content: center; }
  .logo-cross::before, .logo-cross::after { content: ''; position: absolute; background: var(--accent); border-radius: 2px; }
  .logo-cross::before { width: 4px; height: 22px; }
  .logo-cross::after { width: 22px; height: 4px; }
  .logo span { color: var(--accent2); }
  .avatar-sm { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
  .main { display: flex; max-width: 960px; margin: 0 auto; width: 100%; padding: 1.5rem 1rem; gap: 1.5rem; }
  .sidebar { width: 220px; flex-shrink: 0; }
  .sidebar-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
  .sidebar-title { font-size: 11px; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px; color: var(--text2); cursor: pointer; margin-bottom: 2px; transition: background 0.15s, color 0.15s; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent2); }
  .nav-icon { font-size: 16px; width: 18px; text-align: center; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface2); color: var(--text2); border: 0.5px solid var(--border); cursor: pointer; transition: background 0.15s; }
  .tag:hover, .tag.active { background: var(--accent-bg); color: var(--accent2); border-color: var(--accent-border); }
  .feed { flex: 1; min-width: 0; }
  .composer { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1.25rem; }
  .composer-top { display: flex; gap: 10px; align-items: flex-start; }
  .composer textarea { flex: 1; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 14px; resize: none; outline: none; min-height: 72px; transition: border-color 0.15s; width: 100%; }
  .composer textarea:focus { border-color: var(--accent-border); }
  .composer textarea::placeholder { color: var(--text3); }
  .composer-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-left: 44px; }
  .tag-select { background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); font-size: 12px; padding: 5px 8px; outline: none; cursor: pointer; }
  .btn { padding: 7px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text2); border: 0.5px solid var(--border2); }
  .post-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; transition: border-color 0.2s; }
  .post-card:hover { border-color: var(--border2); }
  .post-header { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .post-meta { flex: 1; }
  .post-name { font-size: 14px; font-weight: 700; color: var(--text); }
  .post-info { font-size: 12px; color: var(--text3); margin-top: 1px; }
  .post-tag { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: var(--accent-bg); color: var(--accent2); border: 0.5px solid var(--accent-border); white-space: nowrap; }
  .post-body { font-size: 14px; color: var(--text); line-height: 1.7; margin-bottom: 12px; }
  .post-actions { display: flex; gap: 4px; }
  .action-btn { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 6px 10px; border-radius: var(--radius-sm); transition: background 0.15s, color 0.15s; }
  .action-btn:hover { background: var(--surface2); color: var(--text2); }
  .action-btn.liked { color: var(--red); }
  .action-btn svg { width: 15px; height: 15px; }
  .comments-section { margin-top: 10px; padding-top: 10px; border-top: 0.5px solid var(--border); display: none; }
  .comments-section.open { display: block; }
  .comment-item { display: flex; gap: 8px; padding: 8px 0; border-bottom: 0.5px solid var(--border); }
  .comment-item:last-child { border-bottom: none; }
  .comment-body { flex: 1; }
  .comment-name { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .comment-text { font-size: 13px; color: var(--text2); }
  .comment-composer { display: flex; gap: 8px; margin-top: 10px; }
  .comment-composer input { flex: 1; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 7px 10px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 13px; outline: none; }
  .comment-composer input::placeholder { color: var(--text3); }
  .ai-box { background: var(--accent-bg); border: 0.5px solid var(--accent-border); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 10px; font-size: 13px; color: var(--accent2); display: none; }
  .ai-box.show { display: block; }
  .dot-pulse { display: flex; gap: 4px; }
  .dot-pulse span { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); opacity: 0.4; animation: pulse 1.2s infinite; }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 20px; font-size: 13px; color: var(--text2); opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 1.5rem; width: 340px; max-width: 90vw; }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 1rem; }
  .modal label { font-size: 12px; color: var(--text3); display: block; margin-bottom: 4px; }
  .modal input, .modal select { width: 100%; background: var(--surface2); border: 0.5px solid var(--border2); border-radius: var(--radius-sm); padding: 8px 10px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 13px; outline: none; margin-bottom: 12px; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  .loading-bar { text-align: center; padding: 2rem; color: var(--text3); font-size: 13px; }
  .online-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--green); background: var(--green-bg); padding: 3px 10px; border-radius: 20px; }
  .online-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  .admin-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #f0c060; background: rgba(240,192,96,0.12); padding: 3px 10px; border-radius: 20px; border: 0.5px solid rgba(240,192,96,0.3); }
  .btn-danger { background: rgba(240,96,112,0.15); color: var(--red); border: 0.5px solid rgba(240,96,112,0.3); font-size: 12px; padding: 5px 10px; }
  .btn-danger:hover { background: rgba(240,96,112,0.25); opacity: 1; }
  .btn-block { background: rgba(240,192,96,0.12); color: #f0c060; border: 0.5px solid rgba(240,192,96,0.3); font-size: 12px; padding: 5px 10px; }
  .btn-block:hover { background: rgba(240,192,96,0.22); opacity: 1; }
  .blocked-notice { text-align:center; padding: 8px; font-size:12px; color: var(--text3); font-style: italic; }
  .admin-panel { background: rgba(240,192,96,0.06); border: 0.5px solid rgba(240,192,96,0.2); border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .admin-panel-title { font-size: 12px; color: #f0c060; margin-bottom: 10px; font-weight: 600; letter-spacing: 0.5px; }
  .blocked-list { font-size: 12px; color: var(--text2); }
  .blocked-user-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 0.5px solid var(--border); }
  .confirm-modal { background: var(--surface); border: 0.5px solid var(--border2); border-radius: var(--radius); padding: 1.5rem; width: 300px; max-width: 90vw; text-align: center; }
  .confirm-modal p { font-size: 14px; color: var(--text2); margin-bottom: 1.25rem; line-height: 1.6; }
  .confirm-btns { display: flex; gap: 8px; justify-content: center; }
  @media (max-width: 680px) { .sidebar { display: none; } .main { padding: 1rem 0.75rem; } }
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo"><div class="logo-cross"></div>Worship<span>Link</span></div>
  <div style="display:flex;align-items:center;gap:10px;">
    <a href="index.html" style="font-size:12px;color:var(--text3);text-decoration:none;padding:5px 10px;border:0.5px solid var(--border2);border-radius:var(--radius-sm);">← トップへ</a>
    <div class="online-badge"><div class="online-dot"></div>リアルタイム共有中</div>
    <div class="admin-badge" id="adminBadge" style="display:none;" onclick="openAdminPanel()">👑 管理者</div>
    <div class="avatar-sm" id="headerAvatar" onclick="openProfile()" title="プロフィール設定"></div>
  </div>
</header>
<div class="main">
  <aside class="sidebar">
    <div class="sidebar-card">
      <div class="sidebar-title">メニュー</div>
      <div class="nav-item active" onclick="filterTag('')"><span class="nav-icon">🏠</span> すべての投稿</div>
      <div class="nav-item" onclick="filterTag('初めての方へ')"><span class="nav-icon">🌱</span> 初めての方へ</div>
      <div class="nav-item" onclick="filterTag('日常の恵み')"><span class="nav-icon">☀️</span> 日常の恵み</div>
      <div class="nav-item" onclick="filterTag('祈り')"><span class="nav-icon">🙏</span> 祈りの課題</div>
      <div class="nav-item" onclick="filterTag('賛美')"><span class="nav-icon">🎵</span> 賛美・礼拝</div>
      <div class="nav-item" onclick="filterTag('スタジオ')"><span class="nav-icon">🎹</span> スタジオ情報</div>
      <div class="nav-item" onclick="filterTag('募集')"><span class="nav-icon">📢</span> メンバー募集</div>
    </div>
    <div class="sidebar-card">
      <div class="sidebar-title">タグで探す</div>
      <div class="tag-list">
        <span class="tag" onclick="filterTag('初めての方へ')">初めての方へ</span>
        <span class="tag" onclick="filterTag('日常の恵み')">日常の恵み</span>
        <span class="tag" onclick="filterTag('祈り')">祈り</span>
        <span class="tag" onclick="filterTag('証し')">証し</span>
        <span class="tag" onclick="filterTag('賛美')">賛美</span>
        <span class="tag" onclick="filterTag('礼拝')">礼拝</span>
        <span class="tag" onclick="filterTag('スタジオ')">スタジオ</span>
        <span class="tag" onclick="filterTag('募集')">募集</span>
        <span class="tag" onclick="filterTag('質問')">質問</span>
      </div>
    </div>
  </aside>
  <main class="feed">
    <div class="composer">
      <div class="composer-top">
        <div class="avatar-sm" id="composerAvatar"></div>
        <textarea id="postText" placeholder="今日あった恵み、祈り課題、質問など、なんでも分かち合ってください…" rows="3"></textarea>
      </div>
      <div class="composer-footer">
        <select class="tag-select" id="postTag">
          <option value="日常の恵み">☀️ 日常の恵み</option>
          <option value="初めての方へ">🌱 初めての方へ</option>
          <option value="祈り">🙏 祈り</option>
          <option value="証し">✨ 証し</option>
          <option value="質問">❓ 質問</option>
          <option value="賛美">🎵 賛美</option>
          <option value="礼拝">⛪ 礼拝</option>
          <option value="スタジオ">🎹 スタジオ</option>
          <option value="募集">📢 募集</option>
        </select>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" onclick="aiAssist()">✦ AI応援</button>
          <button class="btn btn-primary" onclick="submitPost()">投稿する</button>
        </div>
      </div>
      <div class="ai-box" id="aiBox">
        <div id="aiLoading" style="display:flex;align-items:center;gap:8px;">
          <span>神様からの励ましを受け取っています</span>
          <div class="dot-pulse"><span></span><span></span><span></span></div>
        </div>
        <div id="aiResult" style="display:none;line-height:1.7;"></div>
      </div>
    </div>
    <div id="feedList"><div class="loading-bar">🕊️ 投稿を読み込み中…</div></div>
  </main>
</div>

<!-- Profile Modal -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <h3>プロフィール設定</h3>
    <label>お名前またはニックネーム</label>
    <input id="pName" type="text" placeholder="例：田中めぐみ、めぐちゃん など">
    <label>所属教会・グループ（記載なくてもOK）</label>
    <input id="pChurch" type="text" placeholder="例：大阪ホープチャーチ、ゴスペル合唱団など">
    <label>あなたはどんな参加者ですか？</label>
    <select id="pRole">
      <optgroup label="— 音楽・礼拝 —">
        <option value="ワーシップリーダー">ワーシップリーダー</option>
        <option value="ピアノ奏者">ピアノ奏者</option>
        <option value="ギタリスト">ギタリスト</option>
        <option value="ヴォーカリスト">ヴォーカリスト</option>
        <option value="ドラマー">ドラマー</option>
        <option value="ベーシスト">ベーシスト</option>
        <option value="その他演奏者">その他演奏者</option>
      </optgroup>
      <optgroup label="— 教会・信仰 —">
        <option value="牧師・伝道師">牧師・伝道師</option>
        <option value="教会スタッフ">教会スタッフ</option>
        <option value="信徒（クリスチャン）">信徒（クリスチャン）</option>
        <option value="求道中">求道中（キリスト教に興味がある）</option>
        <option value="礼拝に来てみた">礼拝に来てみた</option>
      </optgroup>
      <optgroup label="— 一般参加 —">
        <option value="音楽が好き">音楽が好き</option>
        <option value="祈りに関心がある">祈りに関心がある</option>
        <option value="コミュニティを探している">コミュニティを探している</option>
        <option value="友人に誘われた">友人に誘われた</option>
        <option value="その他">その他</option>
      </optgroup>
    </select>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeProfile()">キャンセル</button>
      <button class="btn btn-primary" onclick="saveProfile()">保存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- 管理者パネル -->
<div class="modal-overlay" id="adminModal">
  <div class="modal" style="width:400px;">
    <h3>👑 管理者パネル</h3>
    <div style="font-size:13px;color:var(--text3);margin-bottom:1rem;">管理者パスワードを変更・ブロックユーザーを管理できます。</div>
    <div class="admin-panel">
      <div class="admin-panel-title">🚫 ブロック中のユーザー</div>
      <div class="blocked-list" id="blockedList">（なし）</div>
    </div>
    <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px;">管理者パスワード変更</label>
    <input id="newAdminPw" type="password" placeholder="新しいパスワード" style="width:100%;background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;outline:none;margin-bottom:12px;">
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeAdminPanel()">閉じる</button>
      <button class="btn btn-primary" onclick="changeAdminPw()">パスワード変更</button>
    </div>
  </div>
</div>

<!-- 管理者ログインモーダル -->
<div class="modal-overlay" id="adminLoginModal">
  <div class="modal">
    <h3>👑 管理者ログイン</h3>
    <div style="font-size:13px;color:var(--text3);margin-bottom:1rem;">管理者パスワードを入力してください。</div>
    <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px;">パスワード</label>
    <input id="adminPwInput" type="password" placeholder="管理者パスワード" style="width:100%;background:var(--surface2);border:0.5px solid var(--border2);border-radius:var(--radius-sm);padding:8px 10px;color:var(--text);font-size:13px;outline:none;margin-bottom:12px;" onkeydown="if(event.key==='Enter')checkAdminLogin()">
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeAdminLogin()">キャンセル</button>
      <button class="btn btn-primary" onclick="checkAdminLogin()">ログイン</button>
    </div>
  </div>
</div>

<!-- 確認ダイアログ -->
<div class="modal-overlay" id="confirmModal">
  <div class="confirm-modal">
    <p id="confirmMsg">本当に削除しますか？</p>
    <div class="confirm-btns">
      <button class="btn btn-ghost" onclick="closeConfirm()">キャンセル</button>
      <button class="btn btn-danger" id="confirmOkBtn" onclick="execConfirm()">実行する</button>
    </div>
  </div>
</div>
</div>

<script>
const SUPABASE_URL = 'https://itvzuviktxgjthwgnitf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BlT2DI-F9CpfNb-GXFHZ5w_xz7ujUMj';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const COLORS = ['#7c6cf8','#50c896','#f0c060','#f06070','#60b0f0','#c878f0'];
let profile = JSON.parse(localStorage.getItem('wl_profile') || '{}');
let sessionId = localStorage.getItem('wl_session') || Math.random().toString(36).slice(2);
localStorage.setItem('wl_session', sessionId);
let currentFilter = '';
let likedPosts = JSON.parse(localStorage.getItem('wl_liked') || '[]');

// ===== 管理者設定 =====
const DEFAULT_ADMIN_PW = 'worship2025admin'; // 初期パスワード
let isAdmin = localStorage.getItem('wl_admin') === 'true';
let adminPw = localStorage.getItem('wl_admin_pw') || DEFAULT_ADMIN_PW;
let blockedUsers = JSON.parse(localStorage.getItem('wl_blocked') || '[]');
let confirmCallback = null;

function getColor(name){ return COLORS[(name||'?').charCodeAt(0) % COLORS.length]; }
function getInitials(name){ return (name||'?').charAt(0); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderAvatar(el, name){
  if(!el) return;
  const c = getColor(name||'?');
  el.style.background = c+'28';
  el.style.border = '1.5px solid '+c+'60';
  el.style.color = c;
  el.textContent = getInitials(name||'?');
}

function initProfile(){
  renderAvatar(document.getElementById('headerAvatar'), profile.name);
  renderAvatar(document.getElementById('composerAvatar'), profile.name);
  if(!profile.name) setTimeout(openProfile, 500);
  document.getElementById('adminBadge').style.display = isAdmin ? 'inline-flex' : 'none';
}

function openProfile(){
  document.getElementById('pName').value = profile.name||'';
  document.getElementById('pChurch').value = profile.church||'';
  document.getElementById('pRole').value = profile.role||'信徒（クリスチャン）';
  document.getElementById('profileModal').classList.add('open');
}
function closeProfile(){ document.getElementById('profileModal').classList.remove('open'); }
function saveProfile(){
  profile.name = document.getElementById('pName').value.trim()||'ゲスト';
  profile.church = document.getElementById('pChurch').value.trim();
  profile.role = document.getElementById('pRole').value;
  localStorage.setItem('wl_profile', JSON.stringify(profile));
  initProfile();
  closeProfile();
  showToast('プロフィールを保存しました');
}

// ===== SUPABASE FUNCTIONS =====
async function loadPosts(){
  try {
    let query = sb.from('posts').select('*, comments(*)').order('created_at', {ascending: false});
    if(currentFilter) query = query.eq('tag', currentFilter);
    const { data, error } = await query;
    if(error) throw error;
    renderFeed(data || []);
  } catch(e) {
    document.getElementById('feedList').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div>データの読み込みに失敗しました。<br>しばらくしてから再試行してください。</div>';
    console.error(e);
  }
}

async function submitPost(){
  const text = document.getElementById('postText').value.trim();
  if(!text){ showToast('投稿内容を入力してください'); return; }
  if(!profile.name){ openProfile(); return; }
  const { error } = await sb.from('posts').insert({
    name: profile.name,
    church: profile.church||'',
    role: profile.role||'',
    tag: document.getElementById('postTag').value,
    text: text,
    likes: 0
  });
  if(error){ showToast('投稿に失敗しました'); console.error(error); return; }
  document.getElementById('postText').value = '';
  document.getElementById('aiBox').classList.remove('show');
  showToast('投稿しました 🙌');
  loadPosts();
}

async function toggleLike(postId, currentLikes, isLiked){
  if(isLiked){
    likedPosts = likedPosts.filter(id => id !== postId);
    await sb.from('posts').update({ likes: Math.max(0, currentLikes-1) }).eq('id', postId);
  } else {
    likedPosts.push(postId);
    await sb.from('posts').update({ likes: currentLikes+1 }).eq('id', postId);
  }
  localStorage.setItem('wl_liked', JSON.stringify(likedPosts));
  loadPosts();
}

async function submitComment(postId){
  const input = document.getElementById('cinput-'+postId);
  const text = input.value.trim();
  if(!text) return;
  if(!profile.name){ openProfile(); return; }
  const { error } = await sb.from('comments').insert({
    post_id: postId,
    name: profile.name,
    text: text
  });
  if(error){ showToast('コメントに失敗しました'); return; }
  input.value = '';
  loadPosts();
  setTimeout(()=>{ const el = document.getElementById('comments-'+postId); if(el) el.classList.add('open'); }, 300);
}

// ===== 管理者機能 =====
function openAdminLogin(){
  document.getElementById('adminPwInput').value = '';
  document.getElementById('adminLoginModal').classList.add('open');
  setTimeout(()=>document.getElementById('adminPwInput').focus(), 100);
}
function closeAdminLogin(){ document.getElementById('adminLoginModal').classList.remove('open'); }
function checkAdminLogin(){
  const pw = document.getElementById('adminPwInput').value;
  if(pw === adminPw){
    isAdmin = true;
    localStorage.setItem('wl_admin', 'true');
    closeAdminLogin();
    initProfile();
    showToast('👑 管理者としてログインしました');
    loadPosts();
  } else {
    showToast('パスワードが違います');
  }
}
function openAdminPanel(){
  renderBlockedList();
  document.getElementById('adminModal').classList.add('open');
}
function closeAdminPanel(){ document.getElementById('adminModal').classList.remove('open'); }
function changeAdminPw(){
  const newPw = document.getElementById('newAdminPw').value.trim();
  if(!newPw){ showToast('新しいパスワードを入力してください'); return; }
  if(newPw.length < 6){ showToast('パスワードは6文字以上にしてください'); return; }
  adminPw = newPw;
  localStorage.setItem('wl_admin_pw', newPw);
  document.getElementById('newAdminPw').value = '';
  closeAdminPanel();
  showToast('✅ パスワードを変更しました。次回からは新しいパスワードでログインしてください。');
}
function renderBlockedList(){
  const el = document.getElementById('blockedList');
  if(!blockedUsers.length){ el.innerHTML = '（なし）'; return; }
  el.innerHTML = blockedUsers.map(u=>`
    <div class="blocked-user-item">
      <span>${esc(u)}</span>
      <button class="btn btn-ghost" style="font-size:11px;padding:3px 8px;" onclick="unblockUser('${esc(u)}')">解除</button>
    </div>`).join('');
}
function unblockUser(name){
  blockedUsers = blockedUsers.filter(u=>u!==name);
  localStorage.setItem('wl_blocked', JSON.stringify(blockedUsers));
  renderBlockedList();
  loadPosts();
  showToast(`${name} のブロックを解除しました`);
}

// ===== 削除・ブロック =====
function showConfirm(msg, callback){
  document.getElementById('confirmMsg').textContent = msg;
  confirmCallback = callback;
  document.getElementById('confirmModal').classList.add('open');
}
function closeConfirm(){ document.getElementById('confirmModal').classList.remove('open'); confirmCallback = null; }
function execConfirm(){ if(confirmCallback){ confirmCallback(); } closeConfirm(); }

async function deletePost(postId){
  showConfirm('この投稿を削除しますか？', async ()=>{
    await sb.from('comments').delete().eq('post_id', postId);
    await sb.from('posts').delete().eq('id', postId);
    showToast('投稿を削除しました');
    loadPosts();
  });
}
async function deleteComment(commentId){
  showConfirm('このコメントを削除しますか？', async ()=>{
    await sb.from('comments').delete().eq('id', commentId);
    showToast('コメントを削除しました');
    loadPosts();
  });
}
function blockUser(name){
  showConfirm(`「${name}」をブロックしますか？\nブロックすると投稿・コメントが非表示になります。`, ()=>{
    if(!blockedUsers.includes(name)){
      blockedUsers.push(name);
      localStorage.setItem('wl_blocked', JSON.stringify(blockedUsers));
    }
    showToast(`${name} をブロックしました`);
    loadPosts();
  });
}

// 管理者ログイン：ロゴを5回タップで起動
let logoTapCount = 0, logoTapTimer;
document.querySelector('.logo').addEventListener('click', ()=>{
  if(isAdmin) return;
  logoTapCount++;
  clearTimeout(logoTapTimer);
  logoTapTimer = setTimeout(()=>logoTapCount=0, 2000);
  if(logoTapCount >= 5){ logoTapCount=0; openAdminLogin(); }
});

function filterTag(tag){
  currentFilter = tag;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tag').forEach(el => el.classList.toggle('active', el.textContent.trim()===tag));
  loadPosts();
}

function renderFeed(posts){
  const list = document.getElementById('feedList');
  // ブロックユーザーの投稿を除外
  const visible = posts.filter(p => !blockedUsers.includes(p.name));
  if(!visible.length){
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🕊️</div>まだ投稿がありません。<br>最初の一歩を踏み出してみてください。</div>';
    return;
  }
  list.innerHTML = visible.map(p => {
    const isLiked = likedPosts.includes(p.id);
    const color = getColor(p.name);
    const comments = (p.comments || []).filter(c => !blockedUsers.includes(c.name));
    const timeStr = new Date(p.created_at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
    const isMyPost = profile.name && p.name === profile.name;
    const canDelete = isMyPost || isAdmin;
    return `<div class="post-card">
      <div class="post-header">
        <div class="avatar-sm" style="background:${color}28;border:1.5px solid ${color}60;color:${color};font-size:13px;font-weight:700;">${esc(getInitials(p.name))}</div>
        <div class="post-meta">
          <div class="post-name">${esc(p.name)}${isMyPost?'<span style="font-size:10px;color:var(--text3);margin-left:6px;">（自分）</span>':''}</div>
          <div class="post-info">${esc(p.church||'')}${p.church&&p.role?' · ':''}${esc(p.role||'')} · ${timeStr}</div>
        </div>
        <span class="post-tag">${esc(p.tag)}</span>
      </div>
      <div class="post-body">${esc(p.text).replace(/\n/g,'<br>')}</div>
      <div class="post-actions">
        <button class="action-btn ${isLiked?'liked':''}" onclick="toggleLike(${p.id},${p.likes},${isLiked})">
          <svg viewBox="0 0 24 24" fill="${isLiked?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          ${p.likes}
        </button>
        <button class="action-btn" onclick="document.getElementById('comments-${p.id}').classList.toggle('open')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          ${comments.length} コメント
        </button>
        ${canDelete ? `<button class="btn btn-danger action-btn" onclick="deletePost(${p.id})">🗑 削除</button>` : ''}
        ${isAdmin && !isMyPost ? `<button class="btn btn-block action-btn" onclick="blockUser('${esc(p.name)}')">🚫 ブロック</button>` : ''}
      </div>
      <div class="comments-section" id="comments-${p.id}">
        ${comments.map(c=>`<div class="comment-item">
          <div class="avatar-sm" style="background:${getColor(c.name)}28;border:1.5px solid ${getColor(c.name)}60;color:${getColor(c.name)};font-size:11px;font-weight:700;width:28px;height:28px;flex-shrink:0;">${esc(getInitials(c.name))}</div>
          <div class="comment-body">
            <div class="comment-name">${esc(c.name)}</div>
            <div class="comment-text">${esc(c.text)}</div>
          </div>
          ${(isAdmin || (profile.name && c.name === profile.name)) ? `<button class="btn btn-danger" style="align-self:center;margin-left:8px;" onclick="deleteComment(${c.id})">🗑</button>` : ''}
          ${isAdmin && profile.name !== c.name ? `<button class="btn btn-block" style="align-self:center;margin-left:4px;" onclick="blockUser('${esc(c.name)}')">🚫</button>` : ''}
        </div>`).join('')}
        <div class="comment-composer">
          <div class="avatar-sm" style="background:${getColor(profile.name||'?')}28;border:1.5px solid ${getColor(profile.name||'?')}60;color:${getColor(profile.name||'?')};font-size:11px;font-weight:700;width:28px;height:28px;flex-shrink:0;">${esc(getInitials(profile.name||'?'))}</div>
          <input id="cinput-${p.id}" type="text" placeholder="コメントを入力…" onkeydown="if(event.key==='Enter')submitComment(${p.id})">
          <button class="btn btn-primary" style="padding:5px 12px;font-size:12px;" onclick="submitComment(${p.id})">送信</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function aiAssist(){
  const text = document.getElementById('postText').value.trim();
  const box = document.getElementById('aiBox');
  const loading = document.getElementById('aiLoading');
  const result = document.getElementById('aiResult');
  box.classList.add('show');
  loading.style.display = 'flex';
  result.style.display = 'none';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 1000,
        messages: [{ role: 'user', content: text
          ? `WorshipLinkというコミュニティアプリで、クリスチャンも一般の方も参加しています。以下の投稿内容に対して、信仰の有無に関わらず誰でも受け取れる、温かく寄り添う励ましのメッセージ（3〜4文）を日本語で書いてください。必要であれば聖書のみことばも自然に添えてください。投稿内容：「${text}」`
          : `WorshipLinkというコミュニティアプリです。クリスチャンも一般の方も参加しています。今日の恵みや祈り課題など、誰でも気軽に投稿できるよう、温かく背中を押すメッセージ（3〜4文）を日本語で書いてください。` }]
      })
    });
    const data = await res.json();
    const msg = data.content?.map(b=>b.text||'').join('')||'神様があなたを励ましてくださいます。';
    loading.style.display = 'none';
    result.style.display = 'block';
    result.textContent = msg;
  } catch(e) {
    loading.style.display = 'none';
    result.style.display = 'block';
    result.textContent = '「いつも主にあって喜びなさい。もう一度言います。喜びなさい。」（ピリピ4:4）あなたの賛美は神様に届いています🕊️';
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// リアルタイム購読
function subscribeRealtime(){
  sb.channel('posts-channel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadPosts())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => loadPosts())
    .subscribe();
}

document.getElementById('profileModal').addEventListener('click', function(e){ if(e.target===this) closeProfile(); });
initProfile();
loadPosts();
subscribeRealtime();
</script>
