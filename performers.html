<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorshipLink — 演奏者マッチング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Lato:wght@400;700&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f0faf4; --surface: #ffffff; --surface2: #e8f5ee;
    --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.14);
    --text: #1a2e1a; --text2: #4a6650; --text3: #7a9a80;
    --accent: #6c4ff8; --accent2: #5a3ee0;
    --accent-bg: rgba(108,79,248,0.08); --accent-border: rgba(108,79,248,0.25);
    --green: #2a9a5a; --green-bg: rgba(42,154,90,0.10);
    --radius: 14px; --radius-sm: 8px;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(240,250,244,0.95); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border2);
    padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 56px;
  }
  .logo { font-family: 'Lato', sans-serif; font-size: 20px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .logo-cross { width: 22px; height: 22px; position: relative; display: flex; align-items: center; justify-content: center; }
  .logo-cross::before, .logo-cross::after { content: ''; position: absolute; background: var(--accent); border-radius: 2px; }
  .logo-cross::before { width: 4px; height: 22px; }
  .logo-cross::after { width: 22px; height: 4px; }
  .logo span { color: var(--accent2); }
  .back-btn { font-size: 12px; color: var(--text3); text-decoration: none; padding: 5px 10px; border: 0.5px solid var(--border2); border-radius: var(--radius-sm); }

  /* タブ */
  .tab-nav { display: flex; border-bottom: 1px solid var(--border2); background: var(--surface); padding: 0 1.5rem; }
  .tab-btn { padding: 12px 20px; font-size: 14px; font-weight: 500; color: var(--text3); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s, border-color 0.15s; }
  .tab-btn:hover { color: var(--text2); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-page { display: none; }
  .tab-page.active { display: block; }

  .main { display: flex; max-width: 960px; margin: 0 auto; width: 100%; padding: 1.5rem 1rem; gap: 1.5rem; }
  .sidebar { width: 220px; flex-shrink: 0; }
  .sidebar-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.25rem; margin-bottom: 1rem; }
  .sidebar-title { font-size: 11px; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--radius-sm); font-size: 13px; color: var(--text2); cursor: pointer; margin-bottom: 2px; transition: background 0.15s, color 0.15s; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent); font-weight: 500; }
  .nav-icon { font-size: 16px; width: 18px; text-align: center; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); cursor: pointer; transition: background 0.15s; }
  .tag:hover, .tag.active { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }

  .feed { flex: 1; min-width: 0; }

  /* 演奏者カード */
  .performer-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
  .performer-card { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.25rem; transition: border-color 0.2s, box-shadow 0.2s; cursor: pointer; }
  .performer-card:hover { border-color: var(--accent-border); box-shadow: 0 4px 20px rgba(108,79,248,0.08); }
  .performer-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .performer-avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
  .performer-info { flex: 1; }
  .performer-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .performer-role { font-size: 12px; color: var(--text3); }
  .performer-location { font-size: 12px; color: var(--text2); margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
  .skill-tag { font-size: 11px; padding: 2px 9px; border-radius: 20px; background: var(--accent-bg); color: var(--accent); border: 0.5px solid var(--accent-border); }
  .performer-stats { display: flex; gap: 12px; margin-bottom: 12px; }
  .stat { text-align: center; }
  .stat-num { font-size: 16px; font-weight: 700; color: var(--text); }
  .stat-label { font-size: 10px; color: var(--text3); }
  .performer-desc { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 12px; }
  .studio-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; background: var(--green-bg); color: var(--green); border: 0.5px solid rgba(42,154,90,0.3); border-radius: 20px; padding: 3px 10px; margin-bottom: 12px; font-weight: 600; }
  .btn-contact { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; font-family: 'Noto Sans JP', sans-serif; }
  .btn-contact:hover { opacity: 0.85; }

  /* 登録フォーム */
  .register-form { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.5rem; max-width: 600px; }
  .register-form h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .register-form .sub { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; line-height: 1.6; }
  .form-group { margin-bottom: 1rem; }
  .form-label { font-size: 12px; color: var(--text3); font-weight: 600; display: block; margin-bottom: 5px; }
  .form-input, .form-select, .form-textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 13px; outline: none; transition: border-color 0.15s; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent-border); }
  .form-textarea { resize: vertical; min-height: 80px; }
  .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .checkbox-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); cursor: pointer; }
  .checkbox-item input { accent-color: var(--accent); width: 15px; height: 15px; }
  .btn-submit { background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 12px 32px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; font-family: 'Noto Sans JP', sans-serif; }
  .btn-submit:hover { opacity: 0.85; }
  .success-box { text-align: center; padding: 2rem; }
  .success-icon { font-size: 48px; margin-bottom: 12px; }
  .success-title { font-size: 18px; font-weight: 700; color: var(--green); margin-bottom: 8px; }
  .success-msg { font-size: 13px; color: var(--text2); line-height: 1.7; }

  /* 連絡モーダル */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 300; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius); padding: 1.5rem; width: 420px; max-width: 92vw; }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .modal-sub { font-size: 12px; color: var(--accent); margin-bottom: 1.25rem; font-weight: 600; }
  .modal label { font-size: 12px; color: var(--text3); display: block; margin-bottom: 4px; font-weight: 600; }
  .modal input, .modal textarea { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 9px 11px; color: var(--text); font-family: 'Noto Sans JP', sans-serif; font-size: 13px; outline: none; margin-bottom: 12px; }
  .modal input:focus, .modal textarea:focus { border-color: var(--accent-border); }
  .modal textarea { resize: vertical; min-height: 80px; }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
  .btn { padding: 8px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s; font-family: 'Noto Sans JP', sans-serif; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border2); }
  .contact-success { text-align: center; padding: 1rem 0; }
  .contact-success .icon { font-size: 40px; margin-bottom: 10px; }
  .contact-success h4 { font-size: 16px; font-weight: 700; color: var(--green); margin-bottom: 8px; }
  .contact-success p { font-size: 13px; color: var(--text2); line-height: 1.7; }

  .toast { position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); border-radius: var(--radius-sm); padding: 10px 20px; font-size: 13px; color: #fff; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; z-index: 400; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  @media (max-width: 680px) {
    .sidebar { display: none; }
    .main { padding: 1rem 0.75rem; }
    .performer-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-cross"></div>Worship<span>Link</span></div>
  <a href="index.html" class="back-btn">← トップへ</a>
</header>

<!-- タブ -->
<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('search')" id="tab-search">🔍 演奏者を探す</button>
  <button class="tab-btn" onclick="switchTab('register')" id="tab-register">✏️ 演奏者として登録する</button>
</nav>

<!-- 演奏者を探すタブ -->
<div class="tab-page active" id="page-search">
  <div class="main">
    <aside class="sidebar">
      <div class="sidebar-card">
        <div class="sidebar-title">楽器で探す</div>

        <div class="nav-item" onclick="filterPerformers('ギター', this)"><span class="nav-icon">🎸</span> ギター</div>
        <div class="nav-item" onclick="filterPerformers('ヴォーカル', this)"><span class="nav-icon">🎤</span> ヴォーカル</div>
        <div class="nav-item" onclick="filterPerformers('ドラム', this)"><span class="nav-icon">🥁</span> ドラム</div>
        <div class="nav-item" onclick="filterPerformers('ベース', this)"><span class="nav-icon">🎵</span> ベース</div>

          <span class="tag" onclick="filterPerformers('福岡', null)">福岡</span>
          <span class="tag" onclick="filterPerformers('全国', null)">全国OK</span>
          <span class="tag" onclick="filterPerformers('オンライン', null)">オンライン</span>

      </div>
      <div class="sidebar-card">
        <div class="sidebar-title">スタジオ</div>

      </div>
    </aside>
    <main class="feed">
      <div class="performer-grid" id="performerGrid"></div>

  </div>
</div>

          <label class="form-label">活動地域 *</label>
          <select class="form-select" id="regArea">

            <option>東京</option><option>神奈川</option><option>埼玉</option><option>千葉</option>

        </div>
        <div class="form-group">
          <label class="form-label">担当楽器・役割 *（複数選択可）</label>
          <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" value="ピアノ"> ピアノ</label>

            <label class="checkbox-item"><input type="checkbox" value="その他"> その他</label>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">経験年数</label>
          <select class="form-select" id="regExp">
            <option value="">選択してください</option>
            <option>1年未満</option><option>1〜3年</option><option>3〜5年</option>
            <option>5〜10年</option><option>10年以上</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">ホームスタジオ・練習場所の提供</label>
          <select class="form-select" id="regStudio">
            <option value="なし">なし</option>
            <option value="あり（無料）">あり（無料）</option>

          <textarea class="form-textarea" id="regComment" placeholder="例：礼拝ピアノを10年担当しています。初心者の方への指導経験もあります。どうぞよろしくお願いします。"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">連絡先メールアドレス *</label>
          <input class="form-input" id="regEmail" type="email" placeholder="例：example@email.com">
        </div>
        <button class="btn-submit" onclick="submitRegister()">登録する</button>
      </div>

      <div class="success-box" id="registerSuccess" style="display:none;">
        <div class="success-icon">✅</div>

        <button class="btn btn-primary" style="margin-top:1.25rem;" onclick="switchTab('search')">演奏者一覧を見る</button>

</div>

<!-- 連絡モーダル -->
<div class="modal-overlay" id="contactModal">
  <div class="modal">
    <div id="contactForm">
      <h3>📩 コンタクトを取る</h3>
      <div class="modal-sub" id="contactPerformerName"></div>
      <label>お名前またはニックネーム</label>
      <input id="contactName" type="text" placeholder="例：山田教会 担当：鈴木">

      <label>依頼内容・メッセージ</label>
      <textarea id="contactMsg" placeholder="例：6月の礼拝でピアノをお願いしたいのですが、ご都合はいかがでしょうか。"></textarea>

        <button class="btn btn-ghost" onclick="closeContact()">キャンセル</button>

    <div id="contactSuccess" class="contact-success" style="display:none;">
      <div class="icon">✅</div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const COLORS = ['#6c4ff8','#2a9a5a','#c07000','#c03030','#1a7a9a','#8a2a9a'];
function getColor(name){ return COLORS[(name||'?').charCodeAt(0) % COLORS.length]; }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// サンプル演奏者データ
let PERFORMERS = [
  {
    id:1, name:'田中めぐみ', area:'大阪', role:'ピアノ奏者',
    skills:['ピアノ','キーボード','ワーシップリーダー'],
    exp:'10年以上', lives:87, rating:'4.9',
    studio:'あり（無料）',
    desc:'礼拝ピアノを15年担当。初心者指導経験あり。スタジオ開放中（大阪・梅田）。',
    filter:['ピアノ','大阪','スタジオあり']
  },
  {
    id:2, name:'山下ダビデ', area:'東京', role:'ギタリスト',
    skills:['ギター','ワーシップリーダー','作曲'],
    exp:'10年以上', lives:62, rating:'4.8',
    studio:'あり（無料）',
    desc:'エレキ・アコースティック両対応。東京・渋谷でスタジオ開放中。ワーシップリーダー経験あり。',
    filter:['ギター','東京','スタジオあり']
  },
  {
    id:3, name:'伊藤ルツ', area:'名古屋', role:'ヴォーカリスト',
    skills:['ヴォーカル','ワーシップリーダー'],
    exp:'5〜10年', lives:45, rating:'4.9',
    studio:'なし',
    desc:'ゴスペル・賛美歌を中心に活動。ボイストレーニング経験あり。全国のイベントに参加可。',
    filter:['ヴォーカル','名古屋','全国']
  },
  {
    id:4, name:'佐藤ヨハネ', area:'福岡', role:'ドラマー',
    skills:['ドラム','パーカッション'],
    exp:'5〜10年', lives:38, rating:'4.7',
    studio:'なし',
    desc:'礼拝ドラムを8年担当。ジャズ・ゴスペル・コンテンポラリーワーシップ対応。',
    filter:['ドラム','福岡']
  },
  {
    id:5, name:'中村マリア', area:'東京', role:'バイオリン奏者',
    skills:['バイオリン','弦楽全般'],
    exp:'10年以上', lives:29, rating:'5.0',
    studio:'なし',
    desc:'クラシック・ゴスペル両対応。礼拝やコンサートでの演奏経験豊富。オンライン対応可。',
    filter:['バイオリン','東京','オンライン']
  },
  {
    id:6, name:'鈴木パウロ', area:'全国', role:'ベーシスト',
    skills:['ベース','エレキベース'],
    exp:'3〜5年', lives:21, rating:'4.6',
    studio:'なし',
    desc:'全国どこでも参加可。リモートでの音源提供も対応。ワーシップバンド経験あり。',
    filter:['ベース','全国','オンライン']
  },
];

let currentFilter = '';
let currentPerformer = null;

function filterPerformers(keyword, el){
  currentFilter = keyword;
  document.querySelectorAll('#page-search .nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('#page-search .tag').forEach(t => t.classList.remove('active'));
  if(el){ el.classList.add('active'); }
  renderPerformers();
}

function renderPerformers(){
  const grid = document.getElementById('performerGrid');
  const list = currentFilter
    ? PERFORMERS.filter(p => p.filter.includes(currentFilter) || p.area === currentFilter || p.skills.includes(currentFilter))
    : PERFORMERS;

  if(!list.length){
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🎵</div>該当する演奏者が見つかりませんでした。</div>';
    return;
  }

  grid.innerHTML = list.map(p => {
    const color = getColor(p.name);
    return `
    <div class="performer-card" onclick="openContact(${p.id})">
      <div class="performer-header">
        <div class="performer-avatar" style="background:${color}18;color:${color};border:2px solid ${color}40;">
          ${esc(p.name.charAt(0))}
        </div>
        <div class="performer-info">
          <div class="performer-name">${esc(p.name)}</div>
          <div class="performer-role">${esc(p.role)}</div>
        </div>
      </div>
      <div class="performer-location">📍 ${esc(p.area)} · 経験 ${esc(p.exp)}</div>
      <div class="skill-tags">${p.skills.map(s=>`<span class="skill-tag">${esc(s)}</span>`).join('')}</div>
      <div class="performer-stats">
        <div class="stat"><div class="stat-num">${p.lives}</div><div class="stat-label">出演回数</div></div>
        <div class="stat"><div class="stat-num">${p.rating}★</div><div class="stat-label">評価</div></div>
        <div class="stat"><div class="stat-num">${p.exp}</div><div class="stat-label">経験年数</div></div>
      </div>
      ${p.studio !== 'なし' ? `<div class="studio-badge">🏠 スタジオ${esc(p.studio)}</div>` : ''}
      <div class="performer-desc">${esc(p.desc)}</div>
      <button class="btn-contact" onclick="event.stopPropagation();openContact(${p.id})">📩 コンタクトを取る</button>
    </div>`;
  }).join('');
}

function openContact(id){
  currentPerformer = PERFORMERS.find(p => p.id === id);
  if(!currentPerformer) return;
  document.getElementById('contactPerformerName').textContent = currentPerformer.name + ' さんへ連絡する';
  document.getElementById('contactName').value = '';
  document.getElementById('contactEmail').value = '';
  document.getElementById('contactMsg').value = '';
  document.getElementById('contactForm').style.display = 'block';
  document.getElementById('contactSuccess').style.display = 'none';
  document.getElementById('contactModal').classList.add('open');
}
function closeContact(){
  document.getElementById('contactModal').classList.remove('open');
  currentPerformer = null;
}
function submitContact(){
  const name = document.getElementById('contactName').value.trim();
  const email = document.getElementById('contactEmail').value.trim();
  const msg = document.getElementById('contactMsg').value.trim();
  if(!name){ showToast('お名前を入力してください'); return; }
  if(!email || !email.includes('@')){ showToast('正しいメールアドレスを入力してください'); return; }
  if(!msg){ showToast('メッセージを入力してください'); return; }
  document.getElementById('contactForm').style.display = 'none';
  document.getElementById('contactSuccess').style.display = 'block';
  document.getElementById('contactSuccessMsg').innerHTML =
    `<strong>${esc(currentPerformer.name)}</strong> さんへメッセージを送りました。<br>返信をお待ちください🙏`;
}

function submitRegister(){
  const name = document.getElementById('regName').value.trim();
  const area = document.getElementById('regArea').value;
  const email = document.getElementById('regEmail').value.trim();
  const skills = [...document.querySelectorAll('.checkbox-group input:checked')].map(el => el.value);
  if(!name){ showToast('お名前を入力してください'); return; }
  if(!area){ showToast('活動地域を選択してください'); return; }
  if(!skills.length){ showToast('楽器・役割を選択してください'); return; }
  if(!email || !email.includes('@')){ showToast('正しいメールアドレスを入力してください'); return; }

  const exp = document.getElementById('regExp').value || '未記入';
  const studio = document.getElementById('regStudio').value;
  const comment = document.getElementById('regComment').value.trim();

  // 登録データをローカルに追加（デモ）
  const newPerformer = {
    id: PERFORMERS.length + 1,
    name, area, role: skills[0] + '奏者',
    skills, exp, lives: 0, rating: '新着',
    studio,
    desc: comment || '登録したばかりです。お気軽にコンタクトください。',
    filter: [skills[0], area]
  };
  PERFORMERS.unshift(newPerformer);

  document.getElementById('registerFormWrap').style.display = 'none';
  document.getElementById('registerSuccess').style.display = 'block';
  document.getElementById('registerSuccessMsg').innerHTML =
    `<strong>${esc(name)}</strong> さんの登録が完了しました！<br><br>` +
    `楽器：${esc(skills.join('・'))}<br>` +
    `地域：${esc(area)}<br><br>` +
    `演奏者一覧に掲載されました。教会や主催者からのコンタクトをお待ちください🎵`;
}

function switchTab(tab){
  document.querySelectorAll('.tab-page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

document.getElementById('contactModal').addEventListener('click', function(e){ if(e.target===this) closeContact(); });
renderPerformers();
</script>
</body>
</html>
